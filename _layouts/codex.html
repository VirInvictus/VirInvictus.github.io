---
layout: default
---
<article class="post codex-page">
  <header class="post__header">
    <p class="post__chapter">From the collection</p>
    <h1>{{ page.title }}</h1>
    {%- comment -%} Not <time>: "No. 001" is not a valid datetime value. {%- endcomment -%}
    {% if page.codex_num %}<p class="codex-num">{{ page.codex_num }}</p>{% endif %}
  </header>
  {{ content }}
  <p class="post__back"><a href="{{ '/#the-collection' | relative_url }}">← Return to the codex</a></p>
</article>
