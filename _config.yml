title: Vir Invictus
description: Brandon LaRocque. Programmer, curator, former chef. Native Linux desktop work in Rust and C, local-first by default.

# Absolute base for canonical URLs, sitemap entries, and og: tags.
# Change `url` here (and only here) if the site moves to an owned domain.
url: https://virinvictus.github.io
baseurl: ""
lang: en

author:
  name: Brandon LaRocque

social:
  name: Brandon LaRocque
  links:
    - https://github.com/VirInvictus
    - https://mastodon.social/@Bdkl
    - https://www.linkedin.com/in/bdkl

# Link-preview card (og:image), 1200x630, purpose-built from the masthead lockup.
image: /assets/img/og-card.png

# Both are GitHub Pages-supported but opt-in; neither runs unless listed here.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Internal docs — not pages
exclude:
  - CLAUDE.md
  - AGENTS.md  # symlink to CLAUDE.md for ZCode; Liquid breaks on its raw content
  - Gemfile
  - Gemfile.lock
  - vendor/
